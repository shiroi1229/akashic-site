name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Prepare Azure static artifact
        shell: bash
        run: |
          rm -rf .azure-dist
          mkdir -p .azure-dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.azure-dist' \
            --exclude 'podcast/' \
            ./ .azure-dist/
          python3 - <<'PY2'
          from pathlib import Path
          import json, re

          root = Path('.azure-dist')

          # Remove audio navigation and catalog entries from Azure-only artifacts.
          for p in root.rglob('*.html'):
              s = p.read_text()
              s = re.sub(r'<a\b[^>]*href=["\'][^"\']*podcast/[^"\']*["\'][^>]*>.*?</a>', '', s, flags=re.S|re.I)
              s = re.sub(r'<button\b[^>]*data-atlas-record=["\']ast_[^"\']+["\'][^>]*>.*?</button>', '', s, flags=re.S|re.I)
              s = re.sub(r'<line\b[^>]*data-atlas-edge=["\']ast_[^"\']+["\'][^>]*/?>', '', s, flags=re.I)
              s = re.sub(r'<audio\b.*?</audio>', '', s, flags=re.S|re.I)

              def clean_catalog(m):
                  try:
                      data = json.loads(m.group(1))
                      if isinstance(data, list):
                          data = [x for x in data if not (isinstance(x, dict) and x.get('kind') == 'audio')]
                      return '<script type="application/json" id="intro-catalog">' + json.dumps(data, ensure_ascii=False) + '</script>'
                  except Exception:
                      return m.group(0)
              s = re.sub(r'<script type="application/json" id="intro-catalog">(.*?)</script>', clean_catalog, s, flags=re.S)
              p.write_text(s)

          # Remove audio records from structured catalog snapshots.
          for p in root.rglob('*.json'):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue
              changed = False
              if isinstance(data, dict) and isinstance(data.get('records'), list):
                  new = [x for x in data['records'] if not (isinstance(x, dict) and x.get('kind') == 'audio')]
                  changed = len(new) != len(data['records'])
                  data['records'] = new
              elif isinstance(data, list):
                  new = [x for x in data if not (isinstance(x, dict) and x.get('kind') == 'audio')]
                  changed = len(new) != len(data)
                  data = new
              if changed:
                  p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY2
          test -f .azure-dist/index.html
          test ! -e .azure-dist/podcast
          ! grep -RIl --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' -E 'podcast/|ast_260d9ecc53a8|ast_7cb0d0a4319f|<audio\b|>LISTEN<' .azure-dist
          bytes=$(du -sb .azure-dist | cut -f1)
          echo "azure_dist_bytes=$bytes"
          test "$bytes" -lt 262144000
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_WATER_0B1634B00 }}
          action: "upload"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/.azure-dist" # Prepared static artifact
          api_location: "" # Api source code path - optional
          output_location: "" # No build output directory: repository root is the deploy artifact
          skip_app_build: true # This repository is already-built static HTML/CSS/JS
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
